<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Conference Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            flex: 1;
            min-width: 200px;
        }

        .header-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            min-height: 400px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .local-video video {
            transform: scaleX(-1);
        }

        .remote-video video {
            transform: scaleX(1);
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .video-label.disconnected .status-badge {
            background: #f44336;
            animation: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #da190b;
        }

        .btn-secondary {
            background: #757575;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #616161;
        }

        .toggle-btn {
            background: #ff9800;
            color: white;
        }

        .toggle-btn.active {
            background: #4CAF50;
        }

        .toggle-btn.active:hover:not(:disabled) {
            background: #45a049;
        }

        .toggle-btn:hover:not(:disabled) {
            background: #e68900;
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }

        .status-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .grid-empty {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            min-height: 400px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            button {
                min-width: 100px;
                padding: 10px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Video Conference</h1>
            <div class="header-info">
                <div class="info-item">
                    <span>Room:</span>
                    <strong id="roomId">Loading...</strong>
                </div>
                <div class="info-item">
                    <span>User:</span>
                    <strong id="userName">Loading...</strong>
                </div>
                <div class="info-item">
                    <span>Peers:</span>
                    <strong id="peerCount">0</strong>
                </div>
            </div>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="loadingBox" class="loading">
            <div class="spinner"></div>
            <p>Initializing video conference...</p>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="status-panel">
                <div class="status-item">
                    <div class="status-label">Connection Status</div>
                    <div class="status-value" id="connectionStatus">Connecting...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Video Resolution</div>
                    <div class="status-value" id="videoResolution">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Network Latency</div>
                    <div class="status-value" id="networkLatency">-</div>
                </div>
            </div>

            <div class="controls">
                <button id="micToggle" class="toggle-btn active" onclick="toggleMicrophone()">
                    🎤 Microphone
                </button>
                <button id="videoToggle" class="toggle-btn active" onclick="toggleCamera()">
                    📷 Camera
                </button>
                <button class="btn-secondary" onclick="changeResolution()">
                    ⚙️ Resolution
                </button>
                <button class="btn-danger" onclick="endCall()">
                    📞 End Call
                </button>
            </div>

            <div class="video-container" id="videoGrid">
                <!-- Videos will be dynamically added here -->
            </div>
        </div>
    </div>

    <!-- Socket.IO library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- WebRTC Client -->
    <script>
        // Import WebRTC client functions
    </script>
    <script src="../static/webrtc.js"></script>
</body>
</html>
