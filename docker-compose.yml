version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: conference-db
    environment:
      POSTGRES_DB: conference_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conference-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: conference-django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 4 --bind 0.0.0.0:8000 conference_project.wsgi:application"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-key}
      DATABASE_ENGINE: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: conference_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres123
      REDIS_URL: redis://redis:6379/0
      FLASK_DJANGO_SECRET: ${FLASK_DJANGO_SECRET:-shared-secret}
      SOCKET_SERVER_URL: http://flask:5000
    ports:
      - "8000:8000"
    volumes:
      - ./django_app:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conference-network

  flask:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    container_name: conference-flask
    command: >
      gunicorn --worker-class eventlet -w 1
      --bind 0.0.0.0:5000
      --timeout 120
      signaling_server:app
    environment:
      DEBUG: "False"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-flask-insecure-key}
      DJANGO_BASE_URL: http://django:8000
      FLASK_DJANGO_SECRET: ${FLASK_DJANGO_SECRET:-shared-secret}
    ports:
      - "5000:5000"
    volumes:
      - ./flask_app:/app
    depends_on:
      - django
    networks:
      - conference-network

  nginx:
    image: nginx:alpine
    container_name: conference-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    depends_on:
      - django
      - flask
    networks:
      - conference-network

volumes:
  postgres_data:
  django_static:
  django_media:

networks:
  conference-network:
    driver: bridge
